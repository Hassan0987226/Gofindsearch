<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="A clean, friendly place to search the web.">
    <title>GoFind — Search the web</title>
    <link rel="stylesheet" href="GoFind.css">
    <script src="GoFind.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <!-- Top navigation, theme toggle, and sign-in link -->
      <header class="topbar">
        <nav class="top-links" aria-label="Top navigation">
          <a href="https://about.google/" target="_blank" rel="noreferrer">About</a>
          <a href="https://www.google.com/advanced_search" target="_blank" rel="noreferrer">Advanced search</a>
        </nav>
        <div class="top-actions">
          <button class="icon-button theme-toggle" type="button" aria-label="Switch to dark theme" title="Toggle theme">
            <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.3 8.3 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z"/></svg>
          </button>
          <a class="sign-in" href="https://accounts.google.com/" target="_blank" rel="noreferrer">Sign in</a>
        </div>
      </header>

      <!-- Main search interface and popular destinations -->
      <main class="main-content">
        <!-- Brand, search form, autocomplete, and recent search history -->
        <section class="search-panel" aria-labelledby="brand-name">
          <a class="brand" href="#" aria-label="GoFind home">
            <span id="brand-name">GoFind</span><span class="brand-dot">.</span>
          </a>
          <p class="tagline">Curiosity looks good on you.</p>

          <!-- Search input, voice search, and category selector -->
          <form class="search-form" role="search">
            <div class="search-box">
              <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
              <input id="search-input" name="q" type="search" autocomplete="off" spellcheck="false" aria-label="Search the web" placeholder="Search anything..." autofocus>
              <button class="voice-button" type="button" aria-label="Search by voice" title="Search by voice">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5m-4 0h8"/></svg>
              </button>
              <button class="clear-button" type="button" aria-label="Clear search" title="Clear search" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
              </button>
              <span class="key-hint" aria-hidden="true">/</span>
            </div>
            <div class="autocomplete" id="search-suggestions" role="listbox" aria-label="Search suggestions" hidden></div>
            <p class="search-status" role="status" aria-live="polite"></p>
            <div class="search-options">
              <label class="sr-only" for="search-type">Search category</label>
              <select id="search-type" name="type" aria-label="Search category">
                <option value="web">Web</option>
                <option value="images">Images</option>
                <option value="news">News</option>
                <option value="maps">Maps</option>
              </select>
              <div class="search-buttons">
                <button class="search-submit" type="submit">Search</button>
                <button class="lucky-button" type="button">Surprise me</button>
              </div>
            </div>
          </form>

          <!-- Search history is shown when saved searches are available -->
          <section class="history-section" aria-label="Recent searches" hidden>
            <div class="history-heading">
              <span>Recent searches</span>
              <button class="clear-history" type="button">Clear history</button>
            </div>
            <div class="history-list"></div>
          </section>

          <!-- Example searches to help visitors get started -->
          <div class="trending">
            <span class="trending-label">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 14.5 7.2 10l3 2.7L17 5.5M12.5 5.5H17v4.6"/></svg>
              Try searching
            </span>
            <div class="suggestions" aria-label="Suggested searches">
              <button type="button" class="suggestion" data-query="beautiful places to visit">beautiful places</button>
              <button type="button" class="suggestion" data-query="easy weeknight recipes">easy recipes</button>
              <button type="button" class="suggestion" data-query="how does solar energy work">solar energy</button>
            </div>
          </div>
        </section>

        <!-- Shortcuts to popular websites -->
        <section class="quick-links" aria-label="Popular destinations">
          <a class="quick-link" href="https://www.youtube.com/" target="_blank" rel="noreferrer">
            <span class="quick-icon youtube"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 7.2a2.8 2.8 0 0 0-2-2C17.9 4.7 12 4.7 12 4.7s-5.9 0-7.6.5a2.8 2.8 0 0 0-2 2A29 29 0 0 0 2 12a29 29 0 0 0 .4 4.8 2.8 2.8 0 0 0 2 2c1.7.5 7.6.5 7.6.5s5.9 0 7.6-.5a2.8 2.8 0 0 0 2-2A29 29 0 0 0 22 12a29 29 0 0 0-.4-4.8ZM10 15.2V8.8l5.5 3.2-5.5 3.2Z"/></svg></span>
            <span>YouTube</span>
          </a>
          <a class="quick-link" href="https://www.wikipedia.org/" target="_blank" rel="noreferrer">
            <span class="quick-icon wiki"><span>W</span></span>
            <span>Wikipedia</span>
          </a>
          <a class="quick-link" href="https://news.google.com/" target="_blank" rel="noreferrer">
            <span class="quick-icon news"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM7 8h5v4H7zm8 0h2m-2 3h2m-10 2h10m-10 3h10"/></svg></span>
            <span>News</span>
          </a>
          <a class="quick-link" href="https://maps.google.com/" target="_blank" rel="noreferrer">
            <span class="quick-icon maps"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 21-7-3.5V6.5L12 3l7 3.5v11L12 21Zm0 0V10m7-3.5L12 10 5 6.5"/></svg></span>
            <span>Maps</span>
          </a>
        </section>
      </main>

      <!-- Privacy, terms, and help links -->
      <footer class="footer">
        <span>Made for the endlessly curious <span class="footer-sparkle">✳</span></span>
        <nav aria-label="Footer navigation">
          <a href="https://policies.google.com/privacy" target="_blank" rel="noreferrer">Privacy</a>
          <a href="https://policies.google.com/terms" target="_blank" rel="noreferrer">Terms</a>
          <a href="https://support.google.com/" target="_blank" rel="noreferrer">Help</a>
        </nav>
      </footer>
    </div>
  </body>
</html>
